services:
  coach:
    build: .
    ports:
      - "8501:8501"
    environment:
      # demo (default): anonymized sample match, no Riot key needed. live: your real games.
      RIOT_MODE: ${RIOT_MODE:-demo}
      RIOT_API_KEY: ${RIOT_API_KEY:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_URL: ${LLM_URL:-https://api.cohere.ai/compatibility/v1/chat/completions}
      LLM_MODEL: ${LLM_MODEL:-command-a-plus-05-2026}
    restart: unless-stopped
